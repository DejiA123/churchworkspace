# XcodeGen spec for the iPhone app.
#
# A checked-in .xcodeproj is a merge-conflict machine and, if it is ever
# corrupted, unopenable. This file is the source of truth for the project's
# shape; `xcodegen generate` rebuilds MediaWorkstation.xcodeproj from it in a
# second. A generated project is also committed for people who would rather not
# install anything — see BUILD-IOS.md.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open MediaWorkstation.xcodeproj

name: MediaWorkstation
options:
  bundleIdPrefix: org.church.mediaworkstation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # set this in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  MediaWorkstation:
    type: application
    platform: iOS
    sources:
      - path: MediaWorkstation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.church.mediaworkstation.ios
        PRODUCT_NAME: Church Work Space
        # The display name has a space in it; the MODULE name must not, or
        # `@testable import MediaWorkstation` in the tests stops resolving.
        PRODUCT_MODULE_NAME: MediaWorkstation
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # Exporting a 90-minute service must not be killed by the watchdog when
        # the phone locks; the background modes in Info.plist cover the rest.
        ENABLE_BITCODE: NO
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: Vision.framework
      - sdk: Speech.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: CoreImage.framework
      - sdk: CoreText.framework

  MediaWorkstationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MWEngineTests
    dependencies:
      - target: MediaWorkstation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.church.mediaworkstation.ios.tests
        # The tests live in the app module so they can reach internal types,
        # exactly as `swift test` does through @testable import.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Church Work Space.app/Church Work Space"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MediaWorkstation:
    build:
      targets:
        MediaWorkstation: all
        MediaWorkstationTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MediaWorkstationTests
